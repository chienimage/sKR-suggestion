<!DOCTYPE html>
<html>
<head>
    <title>sKR Suggestion Tool</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .suggestion-container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .suggestion { padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="suggestion-container">
        <h1>sKR Suggestion Tool</h1>
        <div id="suggestions"></div>
        <input type="text" id="userInput" placeholder="Type your suggestion here" />
        <button onclick="addSuggestion()">Add Suggestion</button>
    </div>

    <script>
        let suggestions = [];

        function addSuggestion() {
            const input = document.getElementById('userInput');
            if (input.value.trim() !== '') {
                suggestions.push(input.value);
                input.value = '';
                renderSuggestions();
            }
        }

        function renderSuggestions() {
            const suggestionsDiv = document.getElementById('suggestions');
            suggestionsDiv.innerHTML = '';
            suggestions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'suggestion';
                div.textContent = s;
                suggestionsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
